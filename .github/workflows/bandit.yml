# Bandit is a security linter designed to find common security issues in Python code.
# Results go to the Security tab of the repository.

name: Bandit
on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 4'

permissions:
  contents: read

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
concurrency:
  group: bandit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Plain bandit, not shundor/python-bandit-scan: that action calls tag-pinned actions
      # internally, which the fleet SHA-pinning policy rejects at "Set up job". Same version
      # as the dev dependency in pyproject.toml; its [tool.bandit] table is the config.
      # --exit-zero keeps findings advisory, as before: they land in the Security tab.
      - name: Bandit scan
        run: >-
          uvx --from 'bandit[sarif,toml]==1.9.4' bandit
          -c pyproject.toml -r custom_components
          -f sarif -o bandit.sarif --exit-zero

      - name: Upload Bandit SARIF
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: bandit.sarif
          category: bandit
