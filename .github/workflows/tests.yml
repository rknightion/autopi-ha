name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Run all linting, formatting, and static analysis checks via just
  lint-and-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    name: Linting and Formatting
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'

      - name: Install dependencies
        run: just setup

      - name: Check formatting
        run: just fmt-check

      - name: Run linting
        run: just lint

      - name: Run type checking
        run: just typecheck

  # Check with Home Assistant's hassfest
  hassfest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Hassfest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@f6f29a7ee3fa0eccadf3620a7b9ee00ab54ec03b # zizmor: ignore[ref-version-mismatch] no semver tags; HA ships it from the master branch, pinned by SHA

  # Validate HACS compliance
  hacs:
    runs-on: ubuntu-latest
    name: HACS
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@dcb30e72781db3f207d5236b861172774ab0b485 # zizmor: ignore[ref-version-mismatch] no semver tags; HACS ships it from the main branch, pinned by SHA
        with:
          category: integration

  # Test the integration
  pytest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'

      - name: Install dependencies
        run: just setup

      - name: Create Home Assistant config directory
        run: mkdir -p /tmp/homeassistant

      - name: Run tests with coverage
        env:
          # Set Python path to include the workspace
          PYTHONPATH: ${{ github.workspace }}
          # Ensure UTF-8 encoding for tests
          PYTHONIOENCODING: utf-8
          # Set timezone to avoid any timezone-related test issues
          TZ: UTC
          # Disable Home Assistant analytics
          HA_DISABLE_ANALYTICS: true
          # Set Home Assistant configuration directory
          HOMEASSISTANT_CONFIG_DIR: /tmp/homeassistant
          # Ensure proper locale
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: just test

      # Coverage reports are generated locally (see htmlcov/ directory)
      # Uncomment below to upload to Codecov (requires CODECOV_TOKEN secret)
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # Upload coverage to Codacy. continue-on-error keeps a transient upload
      # failure from breaking the required pytest gate (mirrors Codecov above).
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  # A pull request that closes an issue shows evidence for each of its acceptance criteria. Checks
  # only pull requests with a closing keyword (enforce-all-prs: false), because this repository takes
  # outside and bot pull requests. The reusable fails on any event but pull_request. Check run:
  # `ac-evidence / Acceptance evidence`.
  ac-evidence:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. The reusable fails on any event but pull_request, so it runs on pull requests only.
  # Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
  # backlog/ or move them out, never add or change one there. Reads the file list from the API, so
  # no pull request code is checked out.
  backlog-freeze:
    name: backlog/ is frozen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse additions and changes under backlog/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@e5b9f15bc8ccafdbad75e623bbd0dbb27127f049 # v1.28.0
    with:
      enforce: true

  # Single required status check (the branch ruleset requires only this). if: always() + an explicit
  # failure check so a failed/cancelled leg fails the gate — a skipped `if: success()` aggregator can be
  # mis-read by branch protection as passing. Renovate automerge waits for this to go green.
  ci-success:
    runs-on: ubuntu-latest
    name: ci-success
    # All four jobs are gated: hassfest + hacs were added once the strings.json URL violation was fixed.
    if: always()
    needs:
      - lint-and-scan
      - pytest
      - hassfest
      - hacs
      - ac-evidence
      - privacy-sweep
      - backlog-freeze
      - zizmor
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "A required job failed or was cancelled: ${RESULTS}"
          exit 1
      # A skipped job reports success, so on a pull request the pull request checks must have
      # actually run and passed.
      - name: Fail if a pull request check did not run
        if: ${{ github.event_name == 'pull_request' }}
        env:
          AC_EVIDENCE: ${{ needs.ac-evidence.result }}
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
          BACKLOG_FREEZE: ${{ needs.backlog-freeze.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
        run: |
          if [[ "$AC_EVIDENCE" != "success" || "$PRIVACY_SWEEP" != "success" || "$BACKLOG_FREEZE" != "success" || "$ZIZMOR" != "success" ]]; then
            echo "ac-evidence: ${AC_EVIDENCE}, privacy-sweep: ${PRIVACY_SWEEP}, backlog-freeze: ${BACKLOG_FREEZE}, zizmor: ${ZIZMOR}; all must pass on a pull request"
            exit 1
          fi
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: echo "ci-success - ${RESULTS}"
